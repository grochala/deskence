# Builds Deskence and runs `meson test` (data validation and unit tests) on
# the two declared systems. This does not load the extensions into GNOME
# Shell; see docs/testing.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora 45
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >
          dnf -y install meson ninja-build gettext glib2-devel desktop-file-utils
          appstream python3-gobject gtk4 libadwaita gjs python3-pytest
      - name: Build
        run: |
          meson setup _build
          meson compile -C _build
      - name: Test
        run: meson test -C _build --print-errorlogs

  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: docker.io/library/debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            meson ninja-build gettext libglib2.0-bin libglib2.0-dev-bin desktop-file-utils \
            appstream python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gjs python3-pytest locales
          sed -i 's/# pl_PL.UTF-8/pl_PL.UTF-8/' /etc/locale.gen
          locale-gen
      - name: Build
        run: |
          meson setup _build
          meson compile -C _build
      - name: Test
        run: meson test -C _build --print-errorlogs
